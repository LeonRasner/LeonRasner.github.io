<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Base Practice</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1115;
      color: #e8e8e8;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 560px;
      background: #171a21;
      border: 1px solid #2a2f3a;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 1.5rem;
      font-weight: 650;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 0.85rem;
      color: #aeb4c0;
    }

    select,
    input,
    button {
      width: 100%;
      border: 1px solid #303642;
      border-radius: 10px;
      background: #10131a;
      color: #f2f2f2;
      padding: 11px 12px;
      font-size: 1rem;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #6f8cff;
    }

    button {
      cursor: pointer;
      background: #6f8cff;
      border-color: #6f8cff;
      color: #080a10;
      font-weight: 700;
    }

    button.secondary {
      background: #222733;
      color: #e8e8e8;
      border-color: #303642;
    }

    .question {
      margin: 22px 0;
      padding: 22px;
      background: #10131a;
      border: 1px solid #2a2f3a;
      border-radius: 14px;
      text-align: center;
    }

    .number {
      font-size: clamp(2rem, 7vw, 3.5rem);
      font-weight: 750;
      letter-spacing: 0.04em;
      word-break: break-word;
    }

    .meta {
      margin-top: 8px;
      color: #8f98a8;
      font-size: 0.9rem;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .row button {
      flex: 1;
    }

    .feedback {
      min-height: 28px;
      margin-top: 14px;
      font-weight: 650;
    }

    .ok {
      color: #72e39d;
    }

    .bad {
      color: #ff7b7b;
    }

    .small {
      margin-top: 12px;
      color: #8f98a8;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    @media (max-width: 520px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Number Base Practice</h1>

    <div class="grid">
      <label>
        From base
        <select id="fromBase"></select>
      </label>

      <label>
        To base
        <select id="toBase"></select>
      </label>

      <label>
        Maximum decimal value
        <input id="maxValue" type="number" min="1" max="999999999" value="255" />
      </label>

      <label>
        Timer
        <select id="timerMode">
          <option value="on" selected>On</option>
          <option value="off">Off</option>
        </select>
      </label>
    </div>

    <button id="generateBtn">Generate number</button>

    <section class="question">
      <div class="number" id="questionNumber">—</div>
      <div class="meta" id="questionMeta">Choose settings and generate.</div>
    </section>

    <label>
      Your answer
      <input id="answer" autocomplete="off" spellcheck="false" placeholder="Type converted value..." />
    </label>

    <div class="row">
      <button id="checkBtn">Check</button>
      <button class="secondary" id="showBtn">Show answer</button>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="small">
      Digits above 9 use A-F. Leading zeroes are accepted. Use “Random” for either base to get a new base each round.
    </div>
  </main>

  <script>
    const fromBaseEl = document.getElementById("fromBase");
    const toBaseEl = document.getElementById("toBase");
    const maxValueEl = document.getElementById("maxValue");
    const timerModeEl = document.getElementById("timerMode");
    const questionNumberEl = document.getElementById("questionNumber");
    const questionMetaEl = document.getElementById("questionMeta");
    const answerEl = document.getElementById("answer");
    const feedbackEl = document.getElementById("feedback");

    let currentValue = null;
    let currentFromBase = null;
    let currentToBase = null;
    let startTime = null;
    let timerId = null;

    const baseNames = {
      2: "Binary",
      8: "Octal",
      10: "Decimal",
      16: "Hex"
    };

    function fillBaseSelect(select, defaultValue) {
      const random = document.createElement("option");
      random.value = "random";
      random.textContent = "Random";
      select.appendChild(random);

      for (let base = 2; base <= 16; base++) {
        const option = document.createElement("option");
        option.value = String(base);
        option.textContent = baseNames[base]
          ? `${baseNames[base]} (${base})`
          : `Base ${base}`;
        select.appendChild(option);
      }

      select.value = defaultValue;
    }

    fillBaseSelect(fromBaseEl, "10");
    fillBaseSelect(toBaseEl, "2");

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function resolveBase(value) {
      if (value === "random") return randomInt(2, 16);
      return Number(value);
    }

    function digitValue(char) {
      const code = char.toUpperCase().charCodeAt(0);

      if (code >= 48 && code <= 57) return code - 48;      // 0-9
      if (code >= 65 && code <= 70) return code - 55;      // A-F

      return -1;
    }

    function isValidForBase(text, base) {
      if (!text) return false;

      for (const char of text.toUpperCase()) {
        const value = digitValue(char);
        if (value < 0 || value >= base) return false;
      }

      return true;
    }

    function normalize(text) {
      return text.trim().toUpperCase().replace(/^0+(?=[0-9A-F])/, "");
    }

    function formatBase(base) {
      return baseNames[base] ? `${baseNames[base]} / base ${base}` : `base ${base}`;
    }

    function elapsedSeconds() {
      if (!startTime) return "0.0";
      return ((Date.now() - startTime) / 1000).toFixed(1);
    }

    function startTimer() {
      clearInterval(timerId);

      if (timerModeEl.value === "off") {
        startTime = null;
        return;
      }

      startTime = Date.now();

      timerId = setInterval(() => {
        if (currentValue !== null) {
          questionMetaEl.textContent =
            `${formatBase(currentFromBase)} → ${formatBase(currentToBase)} · ${elapsedSeconds()}s`;
        }
      }, 100);
    }

    function generateQuestion() {
      const max = Math.max(1, Math.min(999999999, Number(maxValueEl.value) || 255));

      currentFromBase = resolveBase(fromBaseEl.value);
      currentToBase = resolveBase(toBaseEl.value);

      while (currentToBase === currentFromBase) {
        currentToBase = resolveBase(toBaseEl.value);
      }

      currentValue = randomInt(0, max);

      questionNumberEl.textContent = currentValue.toString(currentFromBase).toUpperCase();
      questionMetaEl.textContent = `${formatBase(currentFromBase)} → ${formatBase(currentToBase)}`;

      answerEl.value = "";
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";

      startTimer();
      answerEl.focus();
    }

    function correctAnswer() {
      return currentValue.toString(currentToBase).toUpperCase();
    }

    function checkAnswer() {
      if (currentValue === null) {
        feedbackEl.textContent = "Generate a number first.";
        feedbackEl.className = "feedback bad";
        return;
      }

      const raw = answerEl.value.trim();

      if (!isValidForBase(raw, currentToBase)) {
        feedbackEl.textContent = `Invalid digit for base ${currentToBase}.`;
        feedbackEl.className = "feedback bad";
        return;
      }

      const userAnswer = normalize(raw);
      const expected = normalize(correctAnswer());

      if (userAnswer === expected) {
        clearInterval(timerId);

        const timeText = timerModeEl.value === "on"
          ? ` Time: ${elapsedSeconds()}s.`
          : "";

        feedbackEl.textContent = `Correct.${timeText}`;
        feedbackEl.className = "feedback ok";
      } else {
        feedbackEl.textContent = "Not quite. Try again.";
        feedbackEl.className = "feedback bad";
      }
    }

    function showAnswer() {
      if (currentValue === null) {
        feedbackEl.textContent = "Generate a number first.";
        feedbackEl.className = "feedback bad";
        return;
      }

      clearInterval(timerId);
      feedbackEl.textContent = `Answer: ${correctAnswer()}`;
      feedbackEl.className = "feedback";
    }

    document.getElementById("generateBtn").addEventListener("click", generateQuestion);
    document.getElementById("checkBtn").addEventListener("click", checkAnswer);
    document.getElementById("showBtn").addEventListener("click", showAnswer);

    answerEl.addEventListener("keydown", event => {
      if (event.key === "Enter") checkAnswer();
    });

    generateQuestion();
  </script>
</body>
</html>
